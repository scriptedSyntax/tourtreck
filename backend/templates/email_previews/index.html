<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Email previews</title></head>
<body style="margin:0;background:#f4f6f8;color:#172033;font-family:Arial,sans-serif;">
  <main style="max-width:760px;margin:50px auto;padding:0 20px;">
    <h1>Email template previews</h1>
    <p>Development-only synthetic previews. No email is sent and no customer information is loaded.</p>
    <div style="display:grid;gap:12px;margin-top:24px;">
      {% for key, preview in previews.items %}<a href="{% url 'email-preview' key %}" style="display:block;padding:16px 18px;background:#fff;border:1px solid #dbe1e8;border-radius:8px;color:#0d6efd;text-decoration:none;font-weight:700;">{{ preview.0 }}</a>{% endfor %}
    </div>
    <p style="margin-top:28px;"><a href="{% url 'admin:index' %}">Return to Admin</a></p>
  </main>
</body>
</html>
